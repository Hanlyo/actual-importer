services:
  dkb-actual-importer:
    build: .
    container_name: dkb-actual-importer
    restart: unless-stopped
    environment:
      - ACTUAL_SERVER_URL=${ACTUAL_SERVER_URL:-https://actual.lan}
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD}
      - ACTUAL_SYNC_ID=${ACTUAL_SYNC_ID}
      - ACTUAL_ACCOUNT_ID=${ACTUAL_ACCOUNT_ID}
      - WATCH_DIR=/csv
      - POLL_INTERVAL=${POLL_INTERVAL:-5000}
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-0}
    volumes:
      - ./csv:/csv
